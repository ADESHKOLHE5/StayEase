spring.application.name=booking-service
server.port=8083

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bookingdb
spring.datasource.username=root
spring.datasource.password=Pass@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Property Service Feign
property.service.url=http://localhost:8082

# Auth Service Feign (new ? for fetching user emails)
auth.service.url=http://localhost:8081

# Business rules
booking.tenant.max-active-requests=30

# App display name (used in email sender name)
app.name=StayEase

# ?? Gmail SMTP (replace with your credentials) ????????????????????????????????
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=//use your email address here
spring.mail.password=//use your email password here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000